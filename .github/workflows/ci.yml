name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  # Runs only when all three Supabase credentials are available as repo
  # secrets. The `secrets` context is not allowed in job-level `if:`
  # expressions, so we detect the credentials in a step and skip the heavy e2e
  # steps when any are absent. Until then the check job above still guards main.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: check
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Detect e2e credentials
        id: creds
        run: |
          missing=""
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then missing="$missing NEXT_PUBLIC_SUPABASE_URL"; fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing="$missing SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -z "$missing" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "All e2e credentials are present."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Missing e2e credentials:$missing — add them as repository secrets to run the e2e suite."
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.creds.outputs.available == 'true'
        run: npm ci
      - name: Install Playwright browsers
        if: steps.creds.outputs.available == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        if: steps.creds.outputs.available == 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
